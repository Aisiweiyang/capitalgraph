[project]
name = "capitalgraph"
version = "0.1.0"
description = "CapitalGraph CN —— 中国企业资本关系、股权穿透与证据可视化研究平台"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "CapitalGraph CN contributors" }]
dependencies = [
    "cg-domain",
    "cg-entity-resolution",
    "cg-capital-graph",
    "cg-connectors",
    "cg-api",
    "cg-workers",
]

[tool.uv.workspace]
members = ["packages/*", "apps/api", "workers"]

[tool.uv.sources]
cg-domain = { workspace = true }
cg-entity-resolution = { workspace = true }
cg-capital-graph = { workspace = true }
cg-connectors = { workspace = true }
cg-api = { workspace = true }
cg-workers = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "apps", "workers", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# RUF001/002/003：中文全角标点在中文注释/文档串中是正常用法，非同形字攻击
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=./data/pytest-tmp"
asyncio_mode = "auto"
markers = [
    "integration: 跨模块集成测试",
    "security: 安全测试",
    "performance: 性能测试（可重复合成规模）",
    "e2e: 端到端测试",
    "slow: 慢速测试",
]

[tool.coverage.run]
source = ["packages", "apps/api/src", "workers/src"]
omit = ["*/tests/*", "*/migrations/*"]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
precision = 1

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
