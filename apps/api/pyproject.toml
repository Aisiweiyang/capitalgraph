[project]
name = "cg-api"
version = "0.1.0"
description = "FastAPI 服务：检索、详情、穿透、时间点、证据、复核、RBAC、审计"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "cg-domain",
    "cg-entity-resolution",
    "cg-capital-graph",
    "cg-connectors",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pyjwt>=2.10",
    "orjson>=3.10",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cg_api"]
