[project]
name = "cg-capital-graph"
version = "0.11.0"
description = "图计算：向上/向下穿透、环路、交叉持股、有效权益聚合、UBO 候选（纯函数、确定性）"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "cg-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cg_capital_graph"]
