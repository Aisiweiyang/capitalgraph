[project]
name = "cg-domain"
version = "0.11.0"
description = "领域模型：实体/标识符/别名/证券、时态声明、证据与来源、解析决策、派生结果"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
sqlite = ["aiosqlite>=0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cg_domain"]
