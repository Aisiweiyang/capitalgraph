[project]
name = "cg-connectors"
version = "0.1.0"
description = "connector SDK、幂等运行器、对象存储、合成演示数据与 CSV fixture 连接器"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "cg-domain",
]

[project.optional-dependencies]
http = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cg_connectors"]
