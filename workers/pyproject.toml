[project]
name = "cg-workers"
version = "0.11.0"
description = "幂等采集 worker：任务轮询、指数退避、失败隔离"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "cg-domain",
    "cg-connectors",
    "cg-entity-resolution",
]

[project.scripts]
cg-worker = "cg_workers.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cg_workers"]
